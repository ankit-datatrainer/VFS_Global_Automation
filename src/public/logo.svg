<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877f2"/>
      <stop offset="100%" stop-color="#0866ff"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1877f2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect width="48" height="48" rx="12" fill="url(#logoGrad)" filter="url(#logoGlow)"/>
  
  <!-- Subtle Internal Highlight -->
  <rect x="1" y="1" width="46" height="23" rx="11" fill="#ffffff" fill-opacity="0.12"/>
  
  <!-- Outer Signal / Sighting Radar Arch -->
  <path d="M 12 19 A 16 16 0 0 1 36 19" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 16 23 A 11 11 0 0 1 32 23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  
  <!-- Central Booking Pin / Calendar Shield -->
  <rect x="15" y="25" width="18" height="15" rx="3.5" fill="#ffffff"/>
  <rect x="15" y="25" width="18" height="4.5" rx="2" fill="#e7f3ff"/>
  <line x1="15" y1="29.5" x2="33" y2="29.5" stroke="#1877f2" stroke-width="1.2"/>
  
  <!-- Top Fasteners -->
  <rect x="18" y="23" width="2.5" height="3.5" rx="1" fill="#ffffff"/>
  <rect x="27.5" y="23" width="2.5" height="3.5" rx="1" fill="#ffffff"/>
  
  <!-- Checkmark / Lightning Slot Detected Emblem -->
  <path d="M 19 35.5 L 22.5 38.5 L 29 32" fill="none" stroke="#1877f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
