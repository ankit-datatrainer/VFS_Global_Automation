<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fbBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877f2"/>
      <stop offset="100%" stop-color="#0866ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Icon Container with Facebook Blue -->
  <rect width="64" height="64" rx="16" fill="url(#fbBlueGrad)"/>
  
  <!-- Outer Relay Waves -->
  <path d="M 17 25 A 21 21 0 0 1 47 25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M 22 30 A 14 14 0 0 1 42 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  
  <!-- Calendar / Slot Base -->
  <rect x="20" y="32" width="24" height="20" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M 20 37 L 44 37" stroke="#1877f2" stroke-width="2"/>
  
  <!-- Calendar Ring Mounts -->
  <rect x="25" y="29" width="3" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="36" y="29" width="3" height="5" rx="1.5" fill="#ffffff"/>
  
  <!-- Active Slot Indicator / Checkmark in Facebook Blue -->
  <path d="M 26 44 L 30 48 L 38 40" fill="none" stroke="#1877f2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
